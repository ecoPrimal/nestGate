<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nestGate — pores in the membrane</title>
<meta name="description" content="nestGate — entry point discrimination. Pure Rust content-addressed storage. Pores in the membrane. Part of the ecoPrimals organism.">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap');
:root { --bg:#060810; --fg:#c9d1d9; --dim:#6e7681; --green:#3fb950; --blue:#58a6ff; --gold:#c9a84c; --cyan:#39d3f5; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'JetBrains Mono',monospace; background:var(--bg); color:var(--fg); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem; }
h1 { font-size:1.5rem; color:var(--cyan); letter-spacing:3px; margin-bottom:0.5rem; }
.sub { color:var(--dim); font-size:0.7rem; letter-spacing:1px; margin-bottom:2rem; }
.live { display:flex; flex-direction:column; gap:0.5rem; font-size:0.65rem; max-width:400px; width:100%; }
.row { display:flex; justify-content:space-between; padding:0.3rem 0; border-bottom:1px solid rgba(255,255,255,0.05); }
.label { color:var(--dim); }
.val { color:var(--green); font-weight:700; }
.nav { display:flex; gap:1rem; margin-top:2rem; font-size:0.6rem; }
.nav a { color:var(--blue); text-decoration:none; }
.nav a:hover { color:var(--fg); }
.gate { font-size:3rem; margin-bottom:1rem; opacity:0.6; }
.pulse { animation: pulse 4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:0.8} }
</style>
</head>
<body>
<div class="gate pulse">🚪</div>
<h1>nestGate</h1>
<p class="sub">pores in the membrane · entry point discrimination</p>

<div class="live">
  <div class="row"><span class="label">role</span><span class="val">content-addressed storage</span></div>
  <div class="row"><span class="label">language</span><span class="val">Pure Rust · AGPL-3.0</span></div>
  <div class="row"><span class="label">crates</span><span class="val" id="crates">loading...</span></div>
  <div class="row"><span class="label">organism</span><span class="val">ecoPrimals</span></div>
  <div class="row"><span class="label">status</span><span class="val" id="status">alive</span></div>
  <div class="row"><span class="label">wave</span><span class="val" id="wave">...</span></div>
</div>

<div class="nav">
  <a href="https://primals.eco">🏠 HUD</a>
  <a href="https://primals.eco/engine.html">⚙️ engine</a>
  <a href="https://github.com/ecoPrimal/nestGate">📦 source</a>
  <a href="https://github.com/ecoPrimals/nestGate">🦀 Rust crates</a>
  <a href="https://crates.io/users/ecoPrimal">📚 crates.io</a>
</div>

<script>
fetch('https://primals.eco/now.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  document.getElementById('wave').textContent = 'wave ' + (d.wave||'?');
}).catch(()=>{});
// Count crates from the repo structure
document.getElementById('crates').textContent = '14 nestgate-* crates';
</script>
</body>
</html>
